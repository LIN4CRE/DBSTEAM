name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Typecheck & Build
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify TypeScript & Lint
        shell: pwsh
        run: bun run lint

      - name: Build Web Application
        shell: pwsh
        run: bun run build
