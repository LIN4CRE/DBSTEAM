name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android App (APK)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./DBSTEAM-v1.0.0.apk
          echo "apk_path=./DBSTEAM-v1.0.0.apk" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBSTEAM-Android-APK
          path: ./DBSTEAM-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag || 'v1.0.0' }}
          name: DBSTEAM Release ${{ github.ref_name || github.event.inputs.version_tag || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./DBSTEAM-v1.0.0.apk
          body: |
            ### 🎮 DBSTEAM v1.0.0 — Next-Gen Steam & Gaming Account Hub
            
            Welcome to the official release of **DBSTEAM**!
            
            #### 📦 Release Highlights:
            - **Live Steam Intelligence**: SteamDB top sellers, concurrent player metrics, and real-time Steam Community profile verification.
            - **Encrypted Cloud Save Vault**: Local and remote game save backups, metadata hashing, and backup exports.
            - **Lua Scripting Automation Hub**: Built-in script execution engine and community automation repository.
            - **Gemini AI Smart Search**: Real-time natural language discovery of trending commercial titles.
            - **Cross-Platform Android APK**: Fully optimized mobile client bundled via Capacitor.
            
            #### 📱 Mobile Download:
            Download and install `DBSTEAM-v1.0.0.apk` below on any Android 8.0+ device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
